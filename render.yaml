services:
  - type: web
    name: vn-invest-assistant-api
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://vn-invest-assistant.vn-invest-assistant.workers.dev
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OWNER_ACCESS_TOKEN
        sync: false
      - key: ALERT_SCHEDULER_TOKEN
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
